<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>RelayOS</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a14;--sidebar:#0f0f1a;--panel:#13131f;--glass:rgba(18,18,35,0.7);--glass-border:rgba(100,100,255,0.1);--blue:#4d9fff;--purple:#a855f7;--cyan:#22d3ee;--green:#22c55e;--gradient:linear-gradient(135deg,#4d9fff,#a855f7);--text:#e2e8f0;--dim:#64748b;--radius:12px;--glow:0 0 20px rgba(77,159,255,0.2)}
html,body{height:100%;font-family:Inter,MiSans,system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
button{font-family:inherit;cursor:pointer}input,textarea{font-family:inherit}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:rgba(77,159,255,0.2);border-radius:2px}

/* BG */
#bg-canvas{position:fixed;inset:0;z-index:0;pointer-events:none}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:linear-gradient(rgba(77,159,255,0.02) 1px,transparent 1px),linear-gradient(90deg,rgba(77,159,255,0.02) 1px,transparent 1px);background-size:50px 50px}

/* Lang */
.lang-sw{position:fixed;top:14px;right:14px;z-index:999;display:flex;gap:3px;background:var(--glass);border:1px solid var(--glass-border);border-radius:6px;padding:3px;backdrop-filter:blur(10px)}
.lang-sw button{padding:4px 12px;border:none;border-radius:4px;background:transparent;color:var(--dim);font-size:11px;font-weight:600;transition:.2s}
.lang-sw button.on{background:rgba(77,159,255,0.2);color:var(--blue)}

/* Pages */
.page{display:none;width:100%;height:100%;position:relative;z-index:2}.page.active{display:flex}

/* LOGIN */
#pg-login{align-items:center;justify-content:center}
.login-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:16px;padding:44px 38px;width:380px;box-shadow:0 8px 50px rgba(0,0,0,0.5),var(--glow);position:relative;overflow:hidden}
.login-card::before{content:'';position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent,rgba(77,159,255,0.04),transparent 25%);animation:spin 10s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login-hd{text-align:center;margin-bottom:28px;position:relative}
.login-hd h1{font-size:30px;font-weight:800;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-hd p{font-size:12px;color:var(--dim);margin-top:6px;line-height:1.5}
.fg{margin-bottom:16px;position:relative}
.fg label{display:block;font-size:11px;color:var(--dim);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.fg input{width:100%;padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid rgba(100,100,255,0.12);border-radius:8px;color:var(--text);font-size:13px;outline:none;transition:.2s}
.fg input:focus{border-color:var(--blue);box-shadow:0 0 10px rgba(77,159,255,0.15)}
.login-btn{width:100%;padding:12px;border:none;border-radius:8px;background:var(--gradient);color:#fff;font-size:14px;font-weight:600;transition:.2s;margin-top:6px}
.login-btn:hover{box-shadow:0 4px 20px rgba(77,159,255,0.4)}
.login-btn:active{transform:scale(.98)}
.social-row{margin-top:24px;text-align:center}
.social-row p{font-size:11px;color:var(--dim);margin-bottom:10px}
.social-row .icons{display:flex;justify-content:center;gap:12px}
.social-row .si{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;transition:.2s;cursor:pointer}
.social-row .si:hover{border-color:var(--blue);box-shadow:var(--glow);transform:translateY(-1px)}
.social-row .si svg{width:16px;height:16px;fill:var(--dim)}
.social-row .si:hover svg{fill:var(--blue)}
.login-err{color:#f87171;font-size:11px;text-align:center;margin-top:6px;display:none}

/* APP */
#pg-app{height:100%}
.sidebar{width:62px;background:var(--sidebar);border-right:1px solid var(--glass-border);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:4px;flex-shrink:0}
.sb-logo{width:34px;height:34px;border-radius:8px;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:#fff;margin-bottom:14px}
.sb-item{width:38px;height:38px;border-radius:8px;display:flex;align-items:center;justify-content:center;transition:.2s;color:var(--dim);position:relative;cursor:pointer}
.sb-item:hover{background:rgba(77,159,255,0.08);color:var(--blue)}
.sb-item.on{background:rgba(77,159,255,0.12);color:var(--blue)}
.sb-item.on::after{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--blue);border-radius:0 3px 3px 0}
.sb-item svg{width:18px;height:18px}
.sb-sep{flex:1}
.sb-item.out{color:#f87171}.sb-item.out:hover{background:rgba(248,113,113,0.08)}

/* Main */
.main-area{flex:1;display:flex;flex-direction:column;overflow:hidden}
.top-bar{padding:12px 20px;border-bottom:1px solid var(--glass-border);display:flex;align-items:center;justify-content:space-between;background:rgba(15,15,26,0.8);backdrop-filter:blur(8px)}
.top-bar h2{font-size:15px;font-weight:600}
.top-right{display:flex;align-items:center;gap:10px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

/* Tab content */
.tab-body{flex:1;overflow-y:auto;padding:20px;display:none;flex-direction:column;gap:16px}
.tab-body.on{display:flex}

/* Cards */
.card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;backdrop-filter:blur(10px);transition:.2s}
.card:hover{border-color:rgba(77,159,255,0.2)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card-title{font-size:13px;font-weight:600;margin-bottom:4px}
.card-desc{font-size:11px;color:var(--dim)}
.card-row{display:flex;gap:12px;flex-wrap:wrap}

/* Stats row */
.stats-row{display:flex;gap:12px}
.stat{flex:1;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);padding:14px;transition:.2s}
.stat:hover{border-color:rgba(77,159,255,0.2);box-shadow:var(--glow)}
.stat-label{font-size:10px;color:var(--dim);text-transform:uppercase}
.stat-val{font-size:20px;font-weight:700;margin-top:2px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}

/* Chat */
.chat-wrap{display:flex;flex:1;gap:0;min-height:0}
.chat-list{width:240px;border-right:1px solid var(--glass-border);overflow-y:auto;padding:12px}
.chat-item{padding:10px 12px;border-radius:8px;cursor:pointer;transition:.15s;margin-bottom:4px}
.chat-item:hover{background:rgba(77,159,255,0.06)}
.chat-item.on{background:rgba(77,159,255,0.1)}
.chat-item .ci-name{font-size:12px;font-weight:600}
.chat-item .ci-msg{font-size:11px;color:var(--dim);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-main{flex:1;display:flex;flex-direction:column}
.chat-msgs{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:12px}
.msg{max-width:70%;padding:10px 14px;border-radius:12px;font-size:13px;line-height:1.5;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{background:rgba(77,159,255,0.12);align-self:flex-end;border-bottom-right-radius:4px}
.msg.ai{background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.15);align-self:flex-start;border-bottom-left-radius:4px}
.chat-input-bar{padding:12px 20px;border-top:1px solid var(--glass-border);display:flex;gap:10px;align-items:center}
.chat-input-bar input{flex:1;padding:10px 14px;background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:8px;color:var(--text);font-size:13px;outline:none;transition:.2s}
.chat-input-bar input:focus{border-color:var(--blue)}
.send-btn{padding:8px 16px;border:none;border-radius:8px;background:var(--gradient);color:#fff;font-size:12px;font-weight:600;transition:.2s}
.send-btn:hover{box-shadow:0 2px 12px rgba(77,159,255,0.4)}

/* Tags */
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(77,159,255,0.1);color:var(--blue);margin-right:4px}
.tag.green{background:rgba(34,197,94,0.1);color:var(--green)}
.tag.purple{background:rgba(168,85,247,0.1);color:var(--purple)}

/* Image gallery */
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.img-card{aspect-ratio:1;background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);display:flex;align-items:center;justify-content:center;font-size:40px;cursor:pointer;transition:.2s;overflow:hidden}
.img-card:hover{border-color:rgba(77,159,255,0.3);box-shadow:var(--glow);transform:scale(1.02)}

/* Memory */
.mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.mem-card{background:var(--glass);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:.2s}
.mem-card:hover{border-color:rgba(168,85,247,0.3);box-shadow:0 0 15px rgba(168,85,247,0.15)}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--glass);backdrop-filter:blur(16px);border:1px solid var(--glass-border);border-radius:8px;padding:10px 20px;font-size:12px;z-index:9999;transition:.3s}
.toast.show{transform:translateX(-50%) translateY(0)}

/* AI Console */
.ai-fab{position:fixed;bottom:24px;right:24px;width:56px;height:56px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9997;box-shadow:0 4px 24px rgba(77,159,255,0.5),0 4px 24px rgba(168,85,247,0.3);transition:transform .3s;animation:fabPulse 3s infinite}
.ai-fab:hover{transform:scale(1.08) rotate(5deg)}
@keyframes fabPulse{0%,100%{box-shadow:0 4px 24px rgba(77,159,255,0.5),0 4px 24px rgba(168,85,247,0.3)}50%{box-shadow:0 4px 40px rgba(77,159,255,0.7),0 4px 40px rgba(168,85,247,0.5)}}
.ai-fab svg{width:26px;height:26px;fill:#fff}
.ai-fab.hide{display:none}
.ai-console{position:fixed;bottom:24px;right:24px;width:420px;max-width:calc(100vw - 48px);height:560px;max-height:calc(100vh - 48px);background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:16px;z-index:9998;display:none;flex-direction:column;overflow:hidden;box-shadow:0 10px 60px rgba(0,0,0,0.6),0 0 40px rgba(77,159,255,0.2);animation:slideUp .3s cubic-bezier(.16,1,.3,1)}
@keyframes slideUp{from{opacity:0;transform:translateY(20px) scale(.95)}to{opacity:1;transform:translateY(0) scale(1)}}
.ai-console.on{display:flex}
.ai-hd{padding:14px 18px;border-bottom:1px solid var(--glass-border);display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,rgba(77,159,255,0.08),rgba(168,85,247,0.08))}
.ai-hd-left{display:flex;align-items:center;gap:8px}
.ai-hd-icon{width:28px;height:28px;border-radius:8px;background:var(--gradient);display:flex;align-items:center;justify-content:center}
.ai-hd-icon svg{width:16px;height:16px;fill:#fff}
.ai-hd-title{font-size:13px;font-weight:700}
.ai-hd-status{font-size:10px;color:var(--green);display:flex;align-items:center;gap:4px}
.ai-hd-status::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.ai-close{background:transparent;border:none;color:var(--dim);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:4px}
.ai-close:hover{background:rgba(255,255,255,0.05);color:var(--text)}
.ai-body{flex:1;overflow-y:auto;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.ai-msg{max-width:90%;padding:10px 12px;border-radius:10px;font-size:12px;line-height:1.5;word-break:break-word}
.ai-msg.user{background:rgba(77,159,255,0.12);align-self:flex-end;border-bottom-right-radius:2px}
.ai-msg.bot{background:rgba(168,85,247,0.08);border:1px solid rgba(168,85,247,0.15);align-self:flex-start;border-bottom-left-radius:2px}
.ai-msg.system{background:rgba(34,197,94,0.06);border:1px solid rgba(34,197,94,0.15);align-self:center;text-align:center;font-size:11px;color:var(--green);max-width:95%}
.ai-suggest{display:flex;flex-wrap:wrap;gap:6px;padding:0 18px 10px}
.ai-chip{padding:4px 10px;border-radius:12px;font-size:10px;background:rgba(77,159,255,0.08);border:1px solid rgba(77,159,255,0.2);color:var(--blue);cursor:pointer;transition:.2s;white-space:nowrap}
.ai-chip:hover{background:rgba(77,159,255,0.15);transform:translateY(-1px)}
.ai-input-bar{padding:12px 14px;border-top:1px solid var(--glass-border);display:flex;gap:8px;align-items:center;background:rgba(0,0,0,0.2)}
.ai-input-bar input{flex:1;padding:10px 12px;background:rgba(0,0,0,0.3);border:1px solid var(--glass-border);border-radius:8px;color:var(--cyan);font-family:'JetBrains Mono',monospace;font-size:12px;outline:none;transition:.2s}
.ai-input-bar input:focus{border-color:var(--blue);box-shadow:0 0 10px rgba(77,159,255,0.2)}
.ai-send{padding:10px 12px;border:none;border-radius:8px;background:var(--gradient);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap}
.ai-send:hover{box-shadow:0 2px 12px rgba(77,159,255,0.4)}
.ai-send svg{width:12px;height:12px;fill:#fff}
@media(max-width:600px){.ai-console{width:calc(100vw - 24px);right:12px;bottom:12px;height:calc(100vh - 100px)}}

/* Theme colors */
body.theme-red{--blue:#ef4444;--purple:#f97316;--gradient:linear-gradient(135deg,#ef4444,#f97316);--glow:0 0 20px rgba(239,68,68,0.3)}
body.theme-green{--blue:#22c55e;--purple:#10b981;--gradient:linear-gradient(135deg,#22c55e,#10b981);--glow:0 0 20px rgba(34,197,94,0.3)}
body.theme-pink{--blue:#ec4899;--purple:#f43f5e;--gradient:linear-gradient(135deg,#ec4899,#f43f5e);--glow:0 0 20px rgba(236,72,153,0.3)}
body.theme-orange{--blue:#f97316;--purple:#eab308;--gradient:linear-gradient(135deg,#f97316,#eab308);--glow:0 0 20px rgba(249,115,22,0.3)}
body.theme-cyan{--blue:#06b6d4;--purple:#3b82f6;--gradient:linear-gradient(135deg,#06b6d4,#3b82f6);--glow:0 0 20px rgba(6,182,212,0.3)}
body.light-mode{--bg:#f3f4f6;--sidebar:#ffffff;--panel:#ffffff;--glass:rgba(255,255,255,0.7);--glass-border:rgba(0,0,0,0.08);--text:#0f172a;--dim:#64748b}
body.light-mode .grid-bg{background-image:linear-gradient(rgba(77,159,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(77,159,255,0.04) 1px,transparent 1px)}
</style></head><body>

for(let i=0;i<50;i++)ps.push(new P);
function loop(){x.clearRect(0,0,w,h);ps.forEach(p=>{p.u();p.d()});
for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<90){x.beginPath();x.moveTo(ps[i].x,ps[i].y);x.lineTo(ps[j].x,ps[j].y);x.strokeStyle=`rgba(77,159,255,${.04*(1-d/90)})`;x.lineWidth=.4;x.stroke()}}
requestAnimationFrame(loop)}loop()})();

// ==================== AI CONSOLE ====================
// 自然语言指令解析器 - 通过 AI 控制台修改 UI
const AI_L={
zh:{title:'AI 控制台',status:'在线',ph:'输入自然语言指令...',send:'发送',welcome:'👋 你好！我是 RelayOS AI 控制台。\n\n试试这些指令：\n• 切换到英文\n• 主题颜色改成红色\n• 跳转到聊天页\n• 切换到浅色模式\n• 添加一个新卡片\n\n支持中英文自由混合！',
unknown:'🤔 不太理解这个指令。可以试试：切换主题、跳转页面、切换语言、修改颜色等。',
execDone:'✓ 已执行：',langSwitched:'已切换到',themeChanged:'主题已更改',nav:'已跳转到',lightOn:'已切换到浅色模式',darkOn:'已切换到深色模式',logoutDone:'已退出登录',cardAdded:'已添加新卡片到当前页面',chatSent:'已在对话中发送消息',confetti:'🎉 彩蛋触发！',reset:'已重置为默认主题',help:'可用指令：\n1. 切换语言: 切换到英文/中文\n2. 修改主题: 主题改成红色/蓝色/绿色/粉色/橙色/青色\n3. 跳转页面: 去首页/对话/社区/绘画/视频/知识库/记忆/任务/设置\n4. 切换模式: 浅色模式/深色模式\n5. 添加卡片: 添加一个新卡片\n6. 发送消息: 在聊天中发送 xxx\n7. 退出登录: 退出/注销\n8. 重置: 重置主题\n9. 彩蛋: 烟花/confetti'},
en:{title:'AI Console',status:'Online',ph:'Type a natural command...',send:'Send',welcome:'👋 Hi! I am the RelayOS AI Console.\n\nTry these commands:\n• Switch to Chinese\n• Change theme to red\n• Go to chat page\n• Switch to light mode\n• Add a new card\n\nBoth Chinese and English supported!',
unknown:'🤔 I don\'t understand. Try: switch theme, navigate, change language, etc.',
execDone:'✓ Done: ',langSwitched:'Switched to',themeChanged:'Theme changed to',nav:'Navigated to',lightOn:'Switched to light mode',darkOn:'Switched to dark mode',logoutDone:'Logged out',cardAdded:'Added new card to current page',chatSent:'Sent message in chat',confetti:'🎉 Easter egg!',reset:'Theme reset to default',help:'Available commands:\n1. Switch language: switch to English/Chinese\n2. Change theme: red/blue/green/pink/orange/cyan\n3. Navigate: go to home/chat/community/image/video/knowledge/memory/tasks/settings\n4. Toggle mode: light/dark mode\n5. Add card: add a new card\n6. Send message: send "xxx" in chat\n7. Logout: logout\n8. Reset: reset theme\n9. Easter egg: confetti/fireworks'}
};
function aiT(k){return AI_L[lang][k]||k}

let aiHistory=[];

function toggleAiConsole(){
const fab=document.getElementById('ai-fab'),panel=document.getElementById('ai-console');
if(panel.classList.contains('on')){panel.classList.remove('on');fab.classList.remove('hide')}
else{panel.classList.add('on');fab.classList.add('hide');
if(aiHistory.length===0){addAiMsg('bot',aiT('welcome'));refreshSuggestions()}
setTimeout(()=>document.getElementById('ai-input').focus(),100)}
}

function updateAiConsoleUI(){
document.getElementById('ai-title').textContent=aiT('title');
document.getElementById('ai-status').textContent=aiT('status');
document.getElementById('ai-input').placeholder=aiT('ph');
document.getElementById('ai-send-text').textContent=aiT('send');
refreshSuggestions();
}

function refreshSuggestions(){
const sg=document.getElementById('ai-suggest');
const suggestions=lang==='zh'
?['主题改成红色','跳转到聊天','切换到英文','浅色模式','添加新卡片','帮助']
:['Change theme to red','Go to chat','Switch to Chinese','Light mode','Add a card','Help'];
sg.innerHTML=suggestions.map(s=>`<div class="ai-chip" onclick="document.getElementById('ai-input').value='${s}';sendAi()">${s}</div>`).join('');
}

function addAiMsg(type,text){
const body=document.getElementById('ai-body');
const msg=document.createElement('div');
msg.className='ai-msg '+type;
msg.textContent=text;
body.appendChild(msg);
body.scrollTop=body.scrollHeight;
aiHistory.push({type,text});
}

function sendAi(){
const input=document.getElementById('ai-input');
const cmd=input.value.trim();if(!cmd)return;
addAiMsg('user',cmd);input.value='';
setTimeout(()=>processAiCommand(cmd),300);
}

// 核心：自然语言指令解析与执行
function processAiCommand(raw){
const cmd=raw.toLowerCase().trim();
let executed=false,response='';

// 1. 语言切换
if(/英文|english|切换.*英|switch.*english|en语言/i.test(cmd)){setLang('en');response=aiT('langSwitched')+' English';executed=true}
else if(/中文|chinese|切换.*中|switch.*chinese|zh语言/i.test(cmd)){setLang('zh');response=aiT('langSwitched')+' 中文';executed=true}

// 2. 主题颜色
else if(/红色|red/i.test(cmd)){document.body.className=document.body.className.replace(/theme-\w+/g,'')+' theme-red';response=aiT('themeChanged')+' 🔴';executed=true}
else if(/绿色|green/i.test(cmd)){document.body.className=document.body.className.replace(/theme-\w+/g,'')+' theme-green';response=aiT('themeChanged')+' 🟢';executed=true}
else if(/粉|pink/i.test(cmd)){document.body.className=document.body.className.replace(/theme-\w+/g,'')+' theme-pink';response=aiT('themeChanged')+' 🌸';executed=true}
else if(/橙|orange|yellow|黄/i.test(cmd)){document.body.className=document.body.className.replace(/theme-\w+/g,'')+' theme-orange';response=aiT('themeChanged')+' 🟠';executed=true}
else if(/青|cyan|蓝绿/i.test(cmd)){document.body.className=document.body.className.replace(/theme-\w+/g,'')+' theme-cyan';response=aiT('themeChanged')+' 🧊';executed=true}
else if(/蓝|blue|紫|purple|默认|default|重置|reset/i.test(cmd)){document.body.className=document.body.className.replace(/theme-\w+/g,'');response=aiT('reset');executed=true}

// 3. 浅色/深色模式
else if(/浅色|light.*mode|白色|light|白天/i.test(cmd)){document.body.classList.add('light-mode');response=aiT('lightOn');executed=true}
else if(/深色|dark.*mode|黑色|dark|暗/i.test(cmd)){document.body.classList.remove('light-mode');response=aiT('darkOn');executed=true}

// 4. 页面导航
else if(/首页|home/i.test(cmd)){go('home');response=aiT('nav')+' 首页/Home';executed=true}
else if(/聊天|对话|chat|conversation/i.test(cmd)){go('chat');response=aiT('nav')+' 对话/Chat';executed=true}
else if(/社区|community|市场|market|发现|discover/i.test(cmd)){go('community');response=aiT('nav')+' 社区/Community';executed=true}
else if(/视频|video/i.test(cmd)){go('video');response=aiT('nav')+' 视频/Video';executed=true}
else if(/图像|绘画|image|paint|draw/i.test(cmd)){go('image');response=aiT('nav')+' 绘画/Image';executed=true}
else if(/知识库|文件|resource|knowledge|file/i.test(cmd)){go('resource');response=aiT('nav')+' 知识库/Resource';executed=true}
else if(/记忆|memory/i.test(cmd)){go('memory');response=aiT('nav')+' 记忆/Memory';executed=true}
else if(/任务|task/i.test(cmd)){go('tasks');response=aiT('nav')+' 任务/Tasks';executed=true}
else if(/设置|setting|config/i.test(cmd)){go('settings');response=aiT('nav')+' 设置/Settings';executed=true}

// 5. 添加卡片
else if(/添加.*卡|add.*card|新卡片|new card/i.test(cmd)){
const activeTab=document.querySelector('.tab-body.on');
if(activeTab){
const card=document.createElement('div');card.className='card';card.style.animation='fadeUp .4s ease';card.style.borderColor='rgba(77,159,255,0.4)';
card.innerHTML=`<div class="card-title">✨ ${lang==='zh'?'AI 生成的卡片':'AI-Generated Card'}</div><div class="card-desc">${lang==='zh'?'通过 AI 控制台指令创建于 '+new Date().toLocaleTimeString():'Created via AI console at '+new Date().toLocaleTimeString()}</div><div style="margin-top:8px"><span class="tag purple">AI</span><span class="tag green">New</span></div>`;
activeTab.appendChild(card);response=aiT('cardAdded');executed=true;}
}

// 6. 发送聊天消息
else if(/发送.*消息|在聊天|send.*message|send.*chat/i.test(cmd)){
go('chat');
setTimeout(()=>{
const match=raw.match(/["'""'](.+?)["'""']/);const msgText=match?match[1]:(lang==='zh'?'来自 AI 控制台的消息':'Hello from AI Console');
const inp=document.getElementById('chat-in');if(inp){inp.value=msgText;sendMsg();}
},300);
response=aiT('chatSent');executed=true;
}

// 7. 退出登录
else if(/退出|登出|注销|logout|log.*out|sign.*out/i.test(cmd)){logout();response=aiT('logoutDone');executed=true}

// 8. 彩蛋 - 撒花效果
else if(/烟花|彩蛋|confetti|firework|celebrate|庆祝|festival/i.test(cmd)){launchConfetti();response=aiT('confetti');executed=true}

// 9. 帮助
else if(/帮助|help|指令|command|支持|support|能做什么/i.test(cmd)){response=aiT('help');executed=true}

// 10. 模糊问候
else if(/你好|hi|hello|hey|嗨/i.test(cmd)){response=lang==='zh'?'你好！我能帮你修改 UI 主题、切换语言、跳转页面等。输入"帮助"查看全部指令。':'Hi! I can change UI theme, switch language, navigate pages. Type "help" for all commands.';executed=true}

if(executed){
if(response.startsWith(aiT('execDone'))||response.includes('\n')||response.startsWith('🎉')||response.startsWith('👋')){addAiMsg('bot',response);}
else{addAiMsg('system',aiT('execDone')+response);}
}else{
addAiMsg('bot',aiT('unknown'));
}
refreshSuggestions();
}

// 彩蛋：撒花
function launchConfetti(){
const colors=['#4d9fff','#a855f7','#22d3ee','#22c55e','#f97316','#ec4899'];
for(let i=0;i<60;i++){
const p=document.createElement('div');
p.style.cssText=`position:fixed;top:${Math.random()*20}%;left:${Math.random()*100}%;width:8px;height:8px;background:${colors[i%colors.length]};border-radius:50%;z-index:10000;pointer-events:none;animation:confettiFall ${2+Math.random()*2}s ease-out forwards;transform:rotate(${Math.random()*360}deg)`;
document.body.appendChild(p);
setTimeout(()=>p.remove(),4000);
}
}

// 在 CSS 中追加 confetti 动画
(function(){const st=document.createElement('style');
st.textContent='@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}';
document.head.appendChild(st);})();

// 初始化 AI 控制台 UI
setTimeout(updateAiConsoleUI,50);
// 修改 setLang 以同步更新 AI 控制台
const _origSetLang=setLang;window.setLang=function(l){_origSetLang(l);updateAiConsoleUI();};
