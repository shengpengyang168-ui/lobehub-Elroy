<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RelayOS Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;overflow:hidden;height:100vh;background:#0a0a0f;color:#e0e0e0}
#loginPage,#appPage{position:absolute;inset:0;transition:opacity .5s}
#appPage{opacity:0;pointer-events:none}
#loginPage{display:flex;align-items:center;justify-content:center;flex-direction:column}
#starfield,#chainScroll,#particleBg{position:fixed;inset:0;pointer-events:none;z-index:0}
#particleBg{z-index:-1}
.login-box{position:relative;z-index:2;background:rgba(20,20,30,.85);border:1px solid rgba(100,100,255,.3);border-radius:16px;padding:48px;text-align:center;backdrop-filter:blur(10px)}
.login-box h1{font-size:28px;margin-bottom:8px;background:linear-gradient(90deg,#6cf,#c6f);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-box p{color:#888;margin-bottom:24px}
.login-box input{width:100%;padding:12px;margin-bottom:12px;border-radius:8px;border:1px solid #333;background:#1a1a2e;color:#fff;font-size:14px}
.login-box button{width:100%;padding:12px;border:none;border-radius:8px;background:linear-gradient(135deg,#4a9eff,#6c5ce7);color:#fff;font-size:16px;cursor:pointer;transition:transform .2s}
.login-box button:hover{transform:scale(1.03)}
.lang-switch{position:fixed;top:16px;right:16px;z-index:9999;background:rgba(30,30,50,.8);border:1px solid #444;border-radius:8px;padding:6px 14px;color:#ccc;cursor:pointer;font-size:13px}
.lang-switch:hover{background:rgba(60,60,80,.9)}
.app-container{display:flex;height:100vh;background:#0d0d14}
.sidebar{width:64px;background:#0a0a12;border-right:1px solid #1a1a2a;display:flex;flex-direction:column;align-items:center;padding-top:16px;gap:4px;position:relative;z-index:10}
.sidebar-item{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;cursor:pointer;position:relative;font-size:20px;transition:background .2s;color:#888;overflow:hidden}
.sidebar-item:hover{background:rgba(100,100,255,.15);color:#fff}
.sidebar-item.active{background:rgba(100,100,255,.25);color:#fff}
.sidebar-item .tooltip{position:absolute;left:56px;background:#222;color:#fff;padding:4px 10px;border-radius:6px;font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;z-index:99}
.sidebar-item:hover .tooltip{opacity:1}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.3);transform:scale(0);animation:rippleAnim .6s linear}
@keyframes rippleAnim{to{transform:scale(4);opacity:0}}
.main-content{flex:1;overflow-y:auto;padding:24px;position:relative}
.page{display:none}.page.active{display:block}
.globe-container{width:200px;height:200px;margin:0 auto 24px}
.globe-container canvas{width:100%;height:100%;border-radius:50%}
.stats-row{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.stat-card{flex:1;min-width:120px;background:rgba(20,20,40,.8);border:1px solid #222;border-radius:12px;padding:16px;text-align:center}
.stat-card h3{font-size:24px;color:#6cf}
.stat-card p{font-size:12px;color:#888}
.quick-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.quick-card{background:rgba(25,25,45,.9);border:1px solid #2a2a4a;border-radius:12px;padding:20px;text-align:center;cursor:pointer;transition:transform .2s,border-color .2s}
.quick-card:hover{transform:translateY(-4px);border-color:#4a9eff}
.quick-card .icon{font-size:28px;margin-bottom:8px}
.chat-layout{display:flex;height:calc(100vh - 100px);gap:12px}
.chat-list{width:240px;background:rgba(15,15,25,.9);border-radius:12px;padding:12px;overflow-y:auto}
.chat-item{padding:10px;border-radius:8px;cursor:pointer;margin-bottom:4px;transition:background .2s}
.chat-item:hover,.chat-item.active{background:rgba(100,100,255,.15)}
.chat-item h4{font-size:13px;color:#ddd}.chat-item p{font-size:11px;color:#666;margin-top:2px}
.chat-area{flex:1;display:flex;flex-direction:column;background:rgba(15,15,25,.9);border-radius:12px;padding:16px}
.messages{flex:1;overflow-y:auto;margin-bottom:12px}
.message{margin-bottom:12px;padding:10px 14px;border-radius:10px;max-width:70%;font-size:14px}
.message.user{background:rgba(74,158,255,.2);margin-left:auto}
.message.bot{background:rgba(40,40,60,.8)}
.chat-input-row{display:flex;gap:8px}
.chat-input-row input{flex:1;padding:10px;border-radius:8px;border:1px solid #333;background:#1a1a2e;color:#fff}
.chat-input-row button{padding:10px 20px;border:none;border-radius:8px;background:#4a9eff;color:#fff;cursor:pointer}
.page-header{font-size:22px;margin-bottom:16px;color:#fff}
.page-desc{color:#888;margin-bottom:20px}
.content-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.content-card{background:rgba(20,20,40,.8);border:1px solid #2a2a4a;border-radius:12px;padding:16px}
.pet-globe{position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;cursor:pointer;z-index:1000;box-shadow:0 0 20px rgba(100,100,255,.3);transition:transform .3s}
.pet-globe:hover{transform:scale(1.1)}
.pet-globe canvas{width:100%;height:100%;border-radius:50%}
.pet-msg{position:fixed;bottom:84px;right:20px;background:rgba(20,20,40,.95);border:1px solid #4a9eff;border-radius:10px;padding:8px 14px;font-size:12px;color:#ccc;z-index:1000;max-width:180px;opacity:0;transition:opacity .3s;pointer-events:none}
.pet-msg.show{opacity:1}
.ai-console{position:fixed;bottom:90px;right:20px;width:320px;background:rgba(12,12,22,.97);border:1px solid #333;border-radius:14px;padding:16px;z-index:1001;display:none;backdrop-filter:blur(12px)}
.ai-console h3{font-size:14px;margin-bottom:10px;color:#6cf}
.ai-console input{width:100%;padding:10px;border-radius:8px;border:1px solid #333;background:#1a1a2e;color:#fff;font-size:13px}
.ai-console .hint{font-size:11px;color:#666;margin-top:8px}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(20,20,40,.95);border:1px solid #4a9eff;border-radius:10px;padding:10px 24px;color:#fff;font-size:14px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.confetti-piece{position:fixed;width:8px;height:8px;z-index:9998;border-radius:2px;animation:confettiFall 3s forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(0) rotate(0deg)}100%{opacity:0;transform:translateY(100vh) rotate(720deg)}}
body.light{background:#f5f5fa;color:#222}
body.light .app-container{background:#f0f0f8}
body.light .sidebar{background:#e8e8f0;border-color:#ddd}
body.light .sidebar-item{color:#555}
body.light .sidebar-item:hover{background:rgba(100,100,200,.1);color:#222}
body.light .stat-card,body.light .content-card,body.light .chat-area,body.light .chat-list{background:rgba(255,255,255,.9);border-color:#ddd}
body.light .quick-card{background:#fff;border-color:#ddd;color:#222}
body.light .login-box{background:rgba(255,255,255,.9);border-color:#ccc}
body.light .login-box input{background:#f0f0f5;border-color:#ccc;color:#222}
body.light .message.bot{background:rgba(230,230,245,.9)}
body.light .ai-console{background:rgba(245,245,255,.97);border-color:#ccc}
body.light .pet-msg{background:rgba(255,255,255,.95);border-color:#4a9eff}
body.light .page-header{color:#222}
body.light .toast{background:rgba(255,255,255,.95);color:#222;border-color:#4a9eff}
</style>
</head>
<body>
<canvas id="starfield"></canvas>
<canvas id="chainScroll"></canvas>
<canvas id="particleBg"></canvas>
<div class="lang-switch" onclick="toggleLang()">&#20013;&#25991;/EN</div>
<div id="loginPage">
<div class="login-box">
<h1>RelayOS</h1>
<p id="loginSubtitle">Next-Gen AI Operating System</p>
<input type="text" placeholder="Username">
<input type="password" placeholder="Password">
<button onclick="doLogin()" id="loginBtn">Login</button>
</div>
</div>
<div id="appPage">
<div class="app-container">
<div class="sidebar" id="sidebar"></div>
<div class="main-content" id="mainContent"></div>
</div>
</div>
<div class="pet-globe" id="petGlobe" onclick="toggleConsole()"><canvas id="petCanvas" width="56" height="56"></canvas></div>
<div class="pet-msg" id="petMsg"></div>
<div class="ai-console" id="aiConsole">
<h3 id="consoleTitle">AI Console</h3>
<input id="consoleInput" onkeydown="if(event.key==='Enter')runCommand()">
<div class="hint" id="consoleHint">Try: theme red, dark mode, light mode, confetti</div>
</div>
<div class="toast" id="toast"></div>

<script>
var lang='en',currentPage='home',consoleOpen=false,themeColor='#4a9eff',petInterval=null;
var labels={
en:{home:'Home',chat:'Chat',community:'Community',image:'Image',video:'Video',resource:'Resource',memory:'Memory',tasks:'Tasks',settings:'Settings',subtitle:'Next-Gen AI Operating System',login:'Login',consoleTitle:'AI Console',consoleHint:'Try: theme red, dark mode, light mode, confetti'},
zh:{home:'\u9996\u9875',chat:'\u804a\u5929',community:'\u793e\u533a',image:'\u56fe\u7247',video:'\u89c6\u9891',resource:'\u8d44\u6e90',memory:'\u8bb0\u5fc6',tasks:'\u4efb\u52a1',settings:'\u8bbe\u7f6e',subtitle:'\u65b0\u4e00\u4ee3 AI \u64cd\u4f5c\u7cfb\u7edf',login:'\u767b\u5f55',consoleTitle:'AI \u63a7\u5236\u53f0',consoleHint:'\u8bd5\u8bd5: theme red, dark mode, light mode, confetti'}
};
var icons=['\u{1F3E0}','\u{1F4AC}','\u{1F310}','\u{1F4F7}','\u{1F3AC}','\u{1F4C2}','\u{1F9E0}','\u2611','\u2699'];
var pageKeys=['home','chat','community','image','video','resource','memory','tasks','settings'];
var petMsgsData={en:['System nominal.','All agents online.','Memory synced.','Tasks running smoothly.','Creativity max!'],zh:['\u7cfb\u7edf\u6b63\u5e38','\u4ee3\u7406\u5728\u7ebf','\u8bb0\u5fc6\u5df2\u540c\u6b65','\u4efb\u52a1\u987a\u5229','\u521b\u9020\u529b\u6ee1\u683c!']};

function doLogin(){enterApp();}
function enterApp(){
  document.getElementById('loginPage').style.opacity='0';
  document.getElementById('loginPage').style.pointerEvents='none';
  document.getElementById('appPage').style.opacity='1';
  document.getElementById('appPage').style.pointerEvents='all';
  buildSidebar();buildPages();setPage('home');startParticles();startPetMessages();
}
function toggleLang(){lang=(lang==='en')?'zh':'en';setLang();}
function setLang(){
  var L=labels[lang];
  document.getElementById('loginSubtitle').textContent=L.subtitle;
  document.getElementById('loginBtn').textContent=L.login;
  document.getElementById('consoleTitle').textContent=L.consoleTitle;
  document.getElementById('consoleHint').textContent=L.consoleHint;
  var items=document.querySelectorAll('.sidebar-item');
  for(var i=0;i<items.length;i++){var k=items[i].getAttribute('data-page');var t=items[i].querySelector('.tooltip');if(t&&k&&L[k])t.textContent=L[k];}
  for(var j=0;j<pageKeys.length;j++){var h=document.getElementById('hdr-'+pageKeys[j]);if(h)h.textContent=L[pageKeys[j]];}
}
function buildSidebar(){
  var sb=document.getElementById('sidebar'),html='';
  for(var i=0;i<pageKeys.length;i++){
    html+='<div class="sidebar-item'+(i===0?' active':'')+'" data-page="'+pageKeys[i]+'" onclick="handleSidebarClick(event)"><span>'+icons[i]+'</span><span class="tooltip">'+labels[lang][pageKeys[i]]+'</span></div>';
  }
  sb.innerHTML=html;
}
function handleSidebarClick(e){
  var item=e.currentTarget,page=item.getAttribute('data-page');
  var rect=item.getBoundingClientRect();
  var rip=document.createElement('span');rip.className='ripple';
  rip.style.left=(e.clientX-rect.left)+'px';rip.style.top=(e.clientY-rect.top)+'px';
  item.appendChild(rip);setTimeout(function(){rip.remove();},600);
  setPage(page);
}
function setPage(page){
  currentPage=page;
  var items=document.querySelectorAll('.sidebar-item');
  for(var i=0;i<items.length;i++)items[i].classList.toggle('active',items[i].getAttribute('data-page')===page);
  var pages=document.querySelectorAll('.page');
  for(var j=0;j<pages.length;j++)pages[j].classList.toggle('active',pages[j].id==='pg-'+page);
  if(page==='home')drawGlobe();
}
function buildPages(){
  var mc=document.getElementById('mainContent');
  mc.innerHTML=pgHome()+pgChat()+pgGeneric('community','\u{1F310}','Explore communities and connect with creators.',['AI Art Hub','Dev Forum','Music Lab','Writers Circle'])+pgGeneric('image','\u{1F4F7}','Generate and browse AI images.',['Text to Image','Style Transfer','Upscale','Gallery'])+pgGeneric('video','\u{1F3AC}','Create and edit AI videos.',['Text to Video','Video Remix','Storyboard','Templates'])+pgGeneric('resource','\u{1F4C2}','Manage your files and resources.',['Documents','Models','Datasets','Exports'])+pgGeneric('memory','\u{1F9E0}','AI memory and knowledge base.',['Conversations','Learned Facts','Preferences','Context'])+pgGeneric('tasks','\u2611','Track ongoing AI tasks.',['Running','Queued','Completed','Scheduled'])+pgGeneric('settings','\u2699','Configure RelayOS.',['Profile','Appearance','API Keys','Notifications']);
}
function pgHome(){
  var L=labels[lang];
  return '<div class="page active" id="pg-home"><h2 class="page-header" id="hdr-home">'+L.home+'</h2><div class="globe-container"><canvas id="globeCanvas" width="200" height="200"></canvas></div><div class="stats-row"><div class="stat-card"><h3>1.2M</h3><p>Users</p></div><div class="stat-card"><h3>89K</h3><p>Models</p></div><div class="stat-card"><h3>4.7B</h3><p>Tokens</p></div><div class="stat-card"><h3>99.9%</h3><p>Uptime</p></div></div><div class="quick-cards"><div class="quick-card" data-nav="chat" onclick="setPage(this.getAttribute(\'data-nav\'))"><div class="icon">\u{1F4AC}</div><div>Chat</div></div><div class="quick-card"><div class="icon">\u{1F517}</div><div>API</div></div><div class="quick-card" data-nav="community" onclick="setPage(this.getAttribute(\'data-nav\'))"><div class="icon">\u{1F310}</div><div>Community</div></div><div class="quick-card" data-nav="image" onclick="setPage(this.getAttribute(\'data-nav\'))"><div class="icon">\u{1F4F7}</div><div>Image</div></div><div class="quick-card" data-nav="video" onclick="setPage(this.getAttribute(\'data-nav\'))"><div class="icon">\u{1F3AC}</div><div>Video</div></div></div></div>';
}
function pgChat(){
  var L=labels[lang];
  return '<div class="page" id="pg-chat"><h2 class="page-header" id="hdr-chat">'+L.chat+'</h2><div class="chat-layout"><div class="chat-list"><div class="chat-item active"><h4>General Assistant</h4><p>Hello! How can I help?</p></div><div class="chat-item"><h4>Code Helper</h4><p>Ready to debug...</p></div><div class="chat-item"><h4>Creative Writer</h4><p>Let me craft something...</p></div></div><div class="chat-area"><div class="messages" id="chatMessages"><div class="message bot">Hello! I am your RelayOS assistant.</div></div><div class="chat-input-row"><input id="chatInput" placeholder="Type a message..." onkeydown="if(event.key===\'Enter\')sendChat()"><button onclick="sendChat()">Send</button></div></div></div></div>';
}
function pgGeneric(key,icon,desc,cards){
  var L=labels[lang];
  var h='<div class="page" id="pg-'+key+'"><h2 class="page-header" id="hdr-'+key+'">'+L[key]+'</h2><p class="page-desc">'+desc+'</p><div class="content-grid">';
  for(var i=0;i<cards.length;i++)h+='<div class="content-card"><div style="font-size:24px;margin-bottom:8px">'+icon+'</div><div>'+cards[i]+'</div></div>';
  return h+'</div></div>';
}
function sendChat(){
  var inp=document.getElementById('chatInput'),val=inp.value.trim();if(!val)return;
  var m=document.getElementById('chatMessages');
  var d=document.createElement('div');d.textContent=val;
  m.innerHTML+='<div class="message user">'+d.innerHTML+'</div>';inp.value='';
  setTimeout(function(){m.innerHTML+='<div class="message bot">Processing your request...</div>';m.scrollTop=m.scrollHeight;},500);
  m.scrollTop=m.scrollHeight;
}
</script>


<script>
function drawGlobe(){
  var c=document.getElementById('globeCanvas');if(!c)return;
  var ctx=c.getContext('2d'),w=200,h=200,cx=100,cy=100,r=80,angle=0;
  function frame(){
    ctx.clearRect(0,0,w,h);
    var g=ctx.createRadialGradient(cx-20,cy-20,10,cx,cy,r);
    g.addColorStop(0,'#1a2a4a');g.addColorStop(1,'#050510');
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    for(var i=0;i<40;i++){
      var a=(i*0.37+angle)%(Math.PI*2),b=(i*0.73)%Math.PI-Math.PI/2;
      var px=cx+Math.cos(b)*Math.cos(a)*r*0.85,py=cy+Math.sin(b)*r*0.85;
      var depth=Math.cos(b)*Math.sin(a);
      if(depth>-0.2){ctx.beginPath();ctx.arc(px,py,1.5,0,Math.PI*2);ctx.fillStyle='rgba(100,200,255,'+(0.3+depth*0.7)+')';ctx.fill();}
    }
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='rgba(100,150,255,0.3)';ctx.lineWidth=2;ctx.stroke();
    angle+=0.01;requestAnimationFrame(frame);
  }
  frame();
}
// Pet Globe
(function(){
  var c=document.getElementById('petCanvas');if(!c)return;
  var ctx=c.getContext('2d'),w=56,h=56,cx=28,cy=28,r=24,angle=0;
  function frame(){
    ctx.clearRect(0,0,w,h);
    var g=ctx.createRadialGradient(cx-6,cy-6,4,cx,cy,r);
    g.addColorStop(0,'#1a2a4a');g.addColorStop(1,'#050510');
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    for(var i=0;i<20;i++){
      var a=(i*0.5+angle)%(Math.PI*2),b=(i*0.9)%Math.PI-Math.PI/2;
      var px=cx+Math.cos(b)*Math.cos(a)*r*0.8,py=cy+Math.sin(b)*r*0.8;
      var depth=Math.cos(b)*Math.sin(a);
      if(depth>-0.1){ctx.beginPath();ctx.arc(px,py,1,0,Math.PI*2);ctx.fillStyle='rgba(100,200,255,'+(0.4+depth*0.6)+')';ctx.fill();}
    }
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='rgba(100,150,255,0.4)';ctx.lineWidth=1.5;ctx.stroke();
    angle+=0.015;requestAnimationFrame(frame);
  }
  frame();
})();
function startPetMessages(){
  if(petInterval)return;
  petInterval=setInterval(function(){
    if(consoleOpen)return;
    var msgs=petMsgsData[lang],msg=msgs[Math.floor(Math.random()*msgs.length)];
    var el=document.getElementById('petMsg');el.textContent=msg;el.classList.add('show');
    setTimeout(function(){el.classList.remove('show');},3000);
  },8000);
}
function toggleConsole(){
  consoleOpen=!consoleOpen;
  document.getElementById('aiConsole').style.display=consoleOpen?'block':'none';
  document.getElementById('petMsg').classList.remove('show');
  if(consoleOpen)document.getElementById('consoleInput').focus();
}
function runCommand(){
  var inp=document.getElementById('consoleInput'),cmd=inp.value.trim().toLowerCase();inp.value='';if(!cmd)return;
  var colors={red:'#ff4757',green:'#2ed573',pink:'#ff6b9d',orange:'#ffa502',cyan:'#00d2d3',blue:'#4a9eff'};
  if(cmd.indexOf('theme')===0){
    var name=cmd.split(' ')[1]||'';
    if(colors[name]){themeColor=colors[name];applyThemeColor();showToast('Theme: '+name);}
    else showToast('Colors: red, green, pink, orange, cyan, blue');
  }else if(cmd==='dark mode'){document.body.classList.remove('light');showToast('Dark mode on');}
  else if(cmd==='light mode'){document.body.classList.add('light');showToast('Light mode on');}
  else if(cmd==='confetti'){fireConfetti();showToast('Confetti!');}
  else showToast('Unknown: '+cmd);
}
function applyThemeColor(){
  var s=document.querySelectorAll('.stat-card h3');
  for(var i=0;i<s.length;i++)s[i].style.color=themeColor;
}
function showToast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(function(){t.classList.remove('show');},2500);}
function fireConfetti(){
  var cols=['#ff4757','#2ed573','#ffa502','#4a9eff','#ff6b9d','#a55eea'];
  for(var i=0;i<60;i++){
    var p=document.createElement('div');p.className='confetti-piece';
    p.style.left=Math.random()*100+'vw';p.style.top='-10px';
    p.style.background=cols[Math.floor(Math.random()*cols.length)];
    p.style.animationDuration=(2+Math.random()*2)+'s';
    p.style.animationDelay=(Math.random()*0.5)+'s';
    document.body.appendChild(p);
    (function(el){setTimeout(function(){el.remove();},4500);})(p);
  }
}
</script>


<script>
// Starfield
(function(){
  var c=document.getElementById('starfield'),ctx=c.getContext('2d'),stars=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  for(var i=0;i<120;i++)stars.push({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,r:Math.random()*1.5+0.5,t:Math.random()*Math.PI*2});
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<stars.length;i++){var s=stars[i];s.t+=0.02;var a=0.4+Math.sin(s.t)*0.4;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fillStyle='rgba(200,220,255,'+a+')';ctx.fill();}
    requestAnimationFrame(draw);
  })();
})();
// Chain Scroll
(function(){
  var c=document.getElementById('chainScroll'),ctx=c.getContext('2d'),chains=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  function add(){chains.push({x:Math.random()*c.width,y:-20,sp:1+Math.random()*2,len:30+Math.random()*60});}
  for(var i=0;i<15;i++){add();chains[i].y=Math.random()*window.innerHeight;}
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    for(var i=chains.length-1;i>=0;i--){
      var ch=chains[i],g=ctx.createLinearGradient(ch.x,ch.y,ch.x,ch.y+ch.len);
      g.addColorStop(0,'rgba(60,120,255,0)');g.addColorStop(0.5,'rgba(60,120,255,0.4)');g.addColorStop(1,'rgba(60,120,255,0)');
      ctx.beginPath();ctx.moveTo(ch.x,ch.y);ctx.lineTo(ch.x,ch.y+ch.len);ctx.strokeStyle=g;ctx.lineWidth=1.5;ctx.stroke();
      ch.y+=ch.sp;if(ch.y>c.height+20){chains.splice(i,1);add();}
    }
    requestAnimationFrame(draw);
  })();
})();
// Particles
function startParticles(){
  var c=document.getElementById('particleBg'),ctx=c.getContext('2d'),pts=[];
  function resize(){c.width=window.innerWidth;c.height=window.innerHeight;}
  resize();window.addEventListener('resize',resize);
  for(var i=0;i<50;i++)pts.push({x:Math.random()*window.innerWidth,y:Math.random()*window.innerHeight,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,r:Math.random()*2+1});
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<pts.length;i++){
      var p=pts[i];p.x+=p.vx;p.y+=p.vy;
      if(p.x<0||p.x>c.width)p.vx*=-1;if(p.y<0||p.y>c.height)p.vy*=-1;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle='rgba(80,120,200,0.2)';ctx.fill();
      for(var j=i+1;j<pts.length;j++){var q=pts[j],dx=p.x-q.x,dy=p.y-q.y,d=Math.sqrt(dx*dx+dy*dy);if(d<120){ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.strokeStyle='rgba(80,120,200,'+(0.1*(1-d/120))+')';ctx.stroke();}}
    }
    requestAnimationFrame(draw);
  })();
}
</script>
