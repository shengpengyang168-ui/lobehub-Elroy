<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RelayOS - Intelligent AI Routing Platform</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0a12;--glass:rgba(18,18,35,0.65);--glass-border:rgba(120,120,255,0.12);--neon-blue:#4d9fff;--neon-purple:#a855f7;--neon-cyan:#22d3ee;--gradient:linear-gradient(135deg,#4d9fff,#a855f7);--text:#e2e8f0;--text-dim:#94a3b8;--radius:16px;--glow-blue:0 0 20px rgba(77,159,255,0.3);--glow-purple:0 0 20px rgba(168,85,247,0.3)}
html,body{height:100%;font-family:'Inter','MiSans',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}
#particles-canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.cosmic-grid{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;background-image:linear-gradient(rgba(77,159,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(77,159,255,0.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.lang-switch{position:fixed;top:20px;right:20px;z-index:999;display:flex;gap:4px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:8px;padding:4px}
.lang-btn{padding:6px 14px;border:none;border-radius:6px;background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;transition:all .3s}
.lang-btn.active{background:rgba(77,159,255,0.2);color:var(--neon-blue);box-shadow:var(--glow-blue)}

/* Pages */
.page{display:none;width:100%;height:100%;position:relative;z-index:2}
.page.active{display:flex}

/* LOGIN PAGE */
#login-page{align-items:center;justify-content:center}
.login-card{background:var(--glass);backdrop-filter:blur(24px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:48px 40px;width:400px;box-shadow:0 8px 60px rgba(0,0,0,0.5),var(--glow-blue);position:relative;overflow:hidden}
.login-card::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 180deg,transparent,rgba(77,159,255,0.05),transparent 30%);animation:cardSpin 8s linear infinite}
@keyframes cardSpin{to{transform:rotate(360deg)}}
.login-logo{text-align:center;margin-bottom:32px;position:relative}
.login-logo h1{font-size:32px;font-weight:700;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.login-logo p{font-size:13px;color:var(--text-dim);margin-top:8px;line-height:1.6}
.form-group{margin-bottom:20px;position:relative}
.form-group label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;text-transform:uppercase;letter-spacing:0.5px}
.form-group input{width:100%;padding:12px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(120,120,255,0.15);border-radius:10px;color:var(--text);font-size:14px;outline:none;transition:all .3s}
.form-group input:focus{border-color:var(--neon-blue);box-shadow:0 0 12px rgba(77,159,255,0.2)}
.login-btn{width:100%;padding:14px;border:none;border-radius:10px;background:var(--gradient);color:#fff;font-size:15px;font-weight:600;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s,box-shadow .3s;margin-top:8px}
.login-btn:hover{transform:translateY(-1px);box-shadow:0 4px 30px rgba(77,159,255,0.4),0 4px 30px rgba(168,85,247,0.3)}
.login-btn:active{transform:scale(0.98)}
.login-btn::after{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(transparent,rgba(255,255,255,0.1),transparent);transform:rotate(45deg);animation:btnShine 3s infinite}
@keyframes btnShine{0%,100%{transform:translateX(-100%) rotate(45deg)}50%{transform:translateX(100%) rotate(45deg)}}
.social-login{margin-top:28px;text-align:center}
.social-login p{font-size:12px;color:var(--text-dim);margin-bottom:14px}
.social-icons{display:flex;justify-content:center;gap:16px}
.social-icon{width:42px;height:42px;border-radius:10px;background:rgba(255,255,255,0.04);border:1px solid var(--glass-border);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s}
.social-icon:hover{border-color:var(--neon-blue);box-shadow:var(--glow-blue);transform:translateY(-2px)}
.social-icon svg{width:20px;height:20px;fill:var(--text-dim);transition:fill .3s}
.social-icon:hover svg{fill:var(--neon-blue)}
.login-error{color:#f87171;font-size:12px;margin-top:8px;display:none;text-align:center}

/* APP PAGE */
#app-page{flex-direction:row;height:100%}
.nav-bar{width:60px;background:var(--glass);backdrop-filter:blur(20px);border-right:1px solid var(--glass-border);display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:6px}
.nav-logo{width:36px;height:36px;border-radius:10px;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;color:#fff;margin-bottom:16px;cursor:pointer}
.nav-item{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .3s;color:var(--text-dim);position:relative}
.nav-item:hover{background:rgba(77,159,255,0.1);color:var(--neon-blue)}
.nav-item.active{background:rgba(77,159,255,0.15);color:var(--neon-blue);box-shadow:var(--glow-blue)}
.nav-item.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:20px;background:var(--neon-blue);border-radius:0 3px 3px 0}
.nav-item svg{width:18px;height:18px}
.nav-spacer{flex:1}
.nav-item.logout{color:#f87171}
.nav-item.logout:hover{background:rgba(248,113,113,0.1);color:#f87171}

/* Main Content */
.app-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.app-header{padding:16px 24px;border-bottom:1px solid var(--glass-border);display:flex;align-items:center;justify-content:space-between;background:var(--glass);backdrop-filter:blur(12px)}
.app-header h2{font-size:16px;font-weight:600}
.header-right{display:flex;align-items:center;gap:12px}
.user-avatar{width:32px;height:32px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;cursor:pointer}
.app-body{flex:1;padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}

/* Sections/Tabs */
.tab-content{display:none}
.tab-content.active{display:flex;flex-direction:column;gap:16px}

/* Console */
.console-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:20px}
.console-title{font-size:13px;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.console-title::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--neon-cyan);box-shadow:0 0 8px var(--neon-cyan);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.console-input{width:100%;padding:14px 18px;background:rgba(0,0,0,0.3);border:1px solid rgba(77,159,255,0.1);border-radius:10px;color:var(--neon-cyan);font-family:'JetBrains Mono',monospace;font-size:13px;outline:none;transition:border-color .3s}
.console-input:focus{border-color:var(--neon-blue)}
.console-output{margin-top:12px;padding:12px 16px;background:rgba(0,0,0,0.4);border-radius:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--neon-cyan);max-height:120px;overflow-y:auto;display:none;white-space:pre-wrap}
.model-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chip{padding:6px 14px;border-radius:20px;font-size:11px;font-weight:500;background:rgba(77,159,255,0.08);border:1px solid rgba(77,159,255,0.2);color:var(--neon-blue);cursor:pointer;transition:all .3s}
.chip:hover{background:rgba(77,159,255,0.15);box-shadow:var(--glow-blue);transform:translateY(-1px)}
.chip.active{background:rgba(168,85,247,0.15);border-color:rgba(168,85,247,0.4);color:var(--neon-purple);box-shadow:var(--glow-purple)}

/* Cards Row */
.cards-row{display:flex;gap:14px}
.stat-card{flex:1;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:12px;padding:16px;transition:all .3s}
.stat-card:hover{border-color:rgba(77,159,255,0.3);box-shadow:var(--glow-blue)}
.stat-label{font-size:11px;color:var(--text-dim);text-transform:uppercase}
.stat-value{font-size:24px;font-weight:700;margin-top:4px;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.stat-bar{height:3px;background:rgba(255,255,255,0.05);border-radius:2px;margin-top:8px;overflow:hidden}
.stat-bar-fill{height:100%;border-radius:2px;background:var(--gradient);transition:width 1s ease}

/* Topology */
.topology-section{display:flex;gap:16px;flex:1;min-height:200px}
.topology-card{flex:2;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px;position:relative;overflow:hidden;min-height:200px}
.topology-card canvas{width:100%;height:100%;display:block}

/* Activity */
.activity-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:16px}
.activity-card h3{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:10px}
.log-item{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:12px}
.log-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.log-dot.success{background:#22c55e;box-shadow:0 0 6px #22c55e}
.log-dot.info{background:var(--neon-blue);box-shadow:0 0 6px var(--neon-blue)}
.log-dot.warn{background:#f59e0b;box-shadow:0 0 6px #f59e0b}
.log-time{color:var(--text-dim);font-family:monospace;font-size:11px;flex-shrink:0}

/* Capabilities */
.capabilities{display:flex;gap:14px}
.cap-card{flex:1;background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:12px;padding:18px;text-align:center;transition:all .3s;cursor:pointer}
.cap-card:hover{border-color:rgba(77,159,255,0.3);box-shadow:var(--glow-blue);transform:translateY(-2px)}
.cap-icon{font-size:28px;margin-bottom:8px}
.cap-title{font-size:12px;font-weight:600;margin-bottom:4px}
.cap-desc{font-size:11px;color:var(--text-dim)}

/* Models page */
.model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.model-card{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:12px;padding:20px;cursor:pointer;transition:all .3s}
.model-card:hover{border-color:rgba(77,159,255,0.3);box-shadow:var(--glow-blue);transform:translateY(-2px)}
.model-card.online .model-status{background:#22c55e;box-shadow:0 0 6px #22c55e}
.model-card.offline .model-status{background:#f87171;box-shadow:0 0 6px #f87171}
.model-name{font-size:14px;font-weight:600;margin-bottom:4px}
.model-provider{font-size:11px;color:var(--text-dim)}
.model-status{width:8px;height:8px;border-radius:50%;position:absolute;top:12px;right:12px}
.model-card{position:relative}
.model-meta{margin-top:12px;display:flex;gap:8px}
.model-tag{font-size:10px;padding:3px 8px;border-radius:6px;background:rgba(77,159,255,0.1);color:var(--neon-blue)}

/* Settings page */
.settings-section{background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:var(--radius);padding:24px}
.settings-section h3{font-size:14px;margin-bottom:16px;color:var(--text)}
.setting-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,0.04)}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:13px}
.setting-desc{font-size:11px;color:var(--text-dim);margin-top:2px}
.toggle{width:40px;height:22px;border-radius:11px;background:rgba(255,255,255,0.1);cursor:pointer;position:relative;transition:all .3s}
.toggle.on{background:rgba(77,159,255,0.4)}
.toggle::after{content:'';width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:transform .3s}
.toggle.on::after{transform:translateX(18px)}

/* Toast */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--glass);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:10px;padding:12px 24px;font-size:13px;z-index:9999;transition:transform .4s ease;box-shadow:0 4px 30px rgba(0,0,0,0.5)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:rgba(34,197,94,0.3)}
.toast.error{border-color:rgba(248,113,113,0.3)}

::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(77,159,255,0.3);border-radius:2px}
</style>
</head>
<body>
<canvas id="particles-canvas"></canvas>
<div class="cosmic-grid"></div>
<div class="lang-switch">
  <button class="lang-btn active" onclick="switchLang('zh')">中文</button>
  <button class="lang-btn" onclick="switchLang('en')">EN</button>
</div>

<!-- LOGIN PAGE -->
<div class="page active" id="login-page">
  <div class="login-card">
    <div class="login-logo">
      <h1>RelayOS</h1>
      <p id="t-tagline">智能 API 路由平台<br/>中继一切，连接每个模型</p>
    </div>
    <div class="form-group">
      <label id="t-email-label">邮箱</label>
      <input type="email" id="email-input" placeholder="your@email.com" />
    </div>
    <div class="form-group">
      <label id="t-pass-label">密码</label>
      <input type="password" id="pass-input" placeholder="输入密码" />
    </div>
    <div class="login-error" id="login-error">邮箱或密码不能为空</div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">登 录</button>
    <div class="social-login">
      <p id="t-social-text">或通过以下方式登录</p>
      <div class="social-icons">
        <div class="social-icon" title="GitHub" onclick="socialLogin('GitHub')"><svg viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg></div>
        <div class="social-icon" title="Google" onclick="socialLogin('Google')"><svg viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg></div>
        <div class="social-icon" title="SSO" onclick="socialLogin('SSO')"><svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 2.18l7 3.12v4.7c0 4.83-3.4 9.36-7 10.5-3.6-1.14-7-5.67-7-10.5V6.3l7-3.12z"/><path d="M11 7h2v6h-2zm0 8h2v2h-2z"/></svg></div>
      </div>
    </div>
  </div>
</div>

<!-- APP PAGE -->
<div class="page" id="app-page">
  <div class="nav-bar">
    <div class="nav-logo">R</div>
    <div class="nav-item active" data-tab="dashboard" onclick="switchTab('dashboard')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 13h8V3H3v10zm0 8h8v-6H3v6zm10 0h8V11h-8v10zm0-18v6h8V3h-8z"/></svg></div>
    <div class="nav-item" data-tab="models" onclick="switchTab('models')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16V8l-1-1.73-7-4-2 0-7 4L3 8v8l1 1.73 7 4 2 0 7-4L21 16z"/></svg></div>
    <div class="nav-item" data-tab="routes" onclick="switchTab('routes')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6zm4 18H6V4h7v5h5v11z"/></svg></div>
    <div class="nav-item" data-tab="logs" onclick="switchTab('logs')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 3h18v2H3zm0 4h18v2H3zm0 4h12v2H3zm0 4h18v2H3zm0 4h12v2H3z"/></svg></div>

    <div class="nav-spacer"></div>
    <div class="nav-item logout" onclick="doLogout()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg></div>
  </div>
  <div class="app-main">
    <div class="app-header">
      <h2 id="t-page-title">仪表盘</h2>
      <div class="header-right">
        <span id="t-welcome" style="font-size:12px;color:var(--text-dim)">欢迎回来</span>
        <div class="user-avatar">U</div>
      </div>
    </div>
    <div class="app-body">
      <!-- DASHBOARD TAB -->
      <div class="tab-content active" id="tab-dashboard"></div>
      <!-- MODELS TAB -->
      <div class="tab-content" id="tab-models"></div>
      <!-- ROUTES TAB -->
      <div class="tab-content" id="tab-routes"></div>
      <!-- LOGS TAB -->
      <div class="tab-content" id="tab-logs"></div>
      <!-- SETTINGS TAB -->
      <div class="tab-content" id="tab-settings"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
</body>
</html>


<script>

let lang='zh';
function t(k){return i18n[lang][k]||k}
function switchLang(l){
  lang=l;
  document.querySelectorAll('.lang-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim()===(l==='zh'?'中文':'EN')));
  updateTexts();
}
function updateTexts(){
  const el=id=>document.getElementById(id);
  if(el('t-tagline'))el('t-tagline').innerHTML=t('tagline');
  if(el('t-email-label'))el('t-email-label').textContent=t('emailLabel');
  if(el('t-pass-label'))el('t-pass-label').textContent=t('passLabel');
  if(el('pass-input'))el('pass-input').placeholder=t('passPlaceholder');
  if(el('login-btn'))el('login-btn').textContent=t('loginBtn');
  if(el('t-social-text'))el('t-social-text').textContent=t('socialText');
  if(el('t-welcome'))el('t-welcome').textContent=t('welcome');
  // Update current page title
  const titles={dashboard:'pageDashboard',models:'pageModels',routes:'pageRoutes',logs:'pageLogs',settings:'pageSettings'};
  if(el('t-page-title')&&currentTab)el('t-page-title').textContent=t(titles[currentTab]);

}

// ===== PAGE NAVIGATION =====
function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== LOGIN =====
function doLogin(){
  const email=document.getElementById('email-input').value.trim();
  const pass=document.getElementById('pass-input').value.trim();
  const err=document.getElementById('login-error');
  if(!email||!pass){err.textContent=t('loginError');err.style.display='block';return;}
  err.style.display='none';
  document.getElementById('login-btn').textContent='...';
  setTimeout(()=>{
    showPage('app-page');
    showToast(t('loginSuccess'),'success');
    initApp();
  },800);
}
function socialLogin(provider){
  showPage('app-page');
  showToast(provider+' '+t('loginSuccess'),'success');
  initApp();
}
function doLogout(){
  showPage('login-page');
  showToast(t('logoutSuccess'),'success');
  document.getElementById('login-btn').textContent=t('loginBtn');
}
// Enter key login
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&document.getElementById('login-page').classList.contains('active'))doLogin()});

// ===== TABS =====
let currentTab='dashboard';
function switchTab(tab){
  currentTab=tab;
  document.querySelectorAll('.nav-item[data-tab]').forEach(n=>n.classList.toggle('active',n.dataset.tab===tab));
  document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  const titles={dashboard:'pageDashboard',models:'pageModels',routes:'pageRoutes',logs:'pageLogs',settings:'pageSettings'};
  document.getElementById('t-page-title').textContent=t(titles[tab]);
  renderCurrentTab();
}

function sendApiRequest(){

  output.style.display='block';
  output.textContent=`> ${input.value}\n\n{"status":"ok","model":"${document.querySelector('.chip.active')?.textContent||'GPT-4o'}","latency":"${Math.floor(Math.random()*200+50)}ms","node":"us-west-2","encrypted":true}`;

}
function showToast(msg,type){

  setTimeout(()=>toast.classList.remove('show'),2500);
}

// ===== TOPOLOGY =====
function initTopology(){
  const canvas=document.getElementById('topology-canvas');
  if(!canvas)return;
  const ctx=canvas.getContext('2d');
  const rect=canvas.parentElement.getBoundingClientRect();
  let w=canvas.width=rect.width-32,h=canvas.height=rect.height-32;
  const nodes=[],nodeCount=12;
  for(let i=0;i<nodeCount;i++)nodes.push({x:0.1+Math.random()*0.8,y:0.1+Math.random()*0.8,r:Math.random()*5+4,pulse:Math.random()*6.28,speed:0.02+Math.random()*0.02,color:['#4d9fff','#a855f7','#22d3ee','#22c55e'][i%4]});
  const edges=[];
  for(let i=0;i<nodeCount;i++){let t1=Math.floor(Math.random()*nodeCount);if(t1!==i)edges.push([i,t1]);let t2=Math.floor(Math.random()*nodeCount);if(t2!==i)edges.push([i,t2]);}
  const flows=[];
  for(let i=0;i<25;i++)flows.push({edge:edges[Math.floor(Math.random()*edges.length)],t:Math.random(),speed:0.003+Math.random()*0.005});
  function animate(){
    ctx.clearRect(0,0,w,h);
    edges.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo(nodes[a].x*w,nodes[a].y*h);ctx.lineTo(nodes[b].x*w,nodes[b].y*h);ctx.strokeStyle='rgba(77,159,255,0.12)';ctx.lineWidth=1;ctx.stroke();});
    flows.forEach(f=>{f.t+=f.speed;if(f.t>1){f.t=0;f.edge=edges[Math.floor(Math.random()*edges.length)];}const[a,b]=f.edge;const x=nodes[a].x*w+(nodes[b].x*w-nodes[a].x*w)*f.t;const y=nodes[a].y*h+(nodes[b].y*h-nodes[a].y*h)*f.t;ctx.beginPath();ctx.arc(x,y,2,0,6.28);ctx.fillStyle='rgba(77,159,255,0.8)';ctx.shadowColor='#4d9fff';ctx.shadowBlur=8;ctx.fill();ctx.shadowBlur=0;});
    nodes.forEach(n=>{n.pulse+=n.speed;const s=1+Math.sin(n.pulse)*0.12;const x=n.x*w,y=n.y*h,r=n.r*s;ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fillStyle=n.color;ctx.shadowColor=n.color;ctx.shadowBlur=10;ctx.fill();ctx.shadowBlur=0;ctx.beginPath();ctx.arc(x,y,r+5,0,6.28);ctx.strokeStyle='rgba(77,159,255,0.15)';ctx.stroke();});
    requestAnimationFrame(animate);
  }
  animate();
}

// ===== PARTICLES =====
(function(){
  const c=document.getElementById('particles-canvas'),ctx=c.getContext('2d');
  let w,h,ps=[];
  function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
  addEventListener('resize',resize);resize();
  class P{constructor(){this.reset()}reset(){this.x=Math.random()*w;this.y=Math.random()*h;this.vx=(Math.random()-.5)*.3;this.vy=(Math.random()-.5)*.3;this.r=Math.random()*1.5+.5;this.a=Math.random()*.4+.1;this.col=Math.random()>.5?'77,159,255':'168,85,247'}update(){this.x+=this.vx;this.y+=this.vy;if(this.x<0||this.x>w||this.y<0||this.y>h)this.reset()}draw(){ctx.beginPath();ctx.arc(this.x,this.y,this.r,0,6.28);ctx.fillStyle=`rgba(${this.col},${this.a})`;ctx.fill()}}
  for(let i=0;i<70;i++)ps.push(new P);
  function loop(){ctx.clearRect(0,0,w,h);ps.forEach(p=>{p.update();p.draw()});for(let i=0;i<ps.length;i++)for(let j=i+1;j<ps.length;j++){const dx=ps[i].x-ps[j].x,dy=ps[i].y-ps[j].y,d=Math.sqrt(dx*dx+dy*dy);if(d<100){ctx.beginPath();ctx.moveTo(ps[i].x,ps[i].y);ctx.lineTo(ps[j].x,ps[j].y);ctx.strokeStyle=`rgba(77,159,255,${.05*(1-d/100)})`;ctx.lineWidth=.5;ctx.stroke()}}requestAnimationFrame(loop)}
  loop();
})();
</script>
